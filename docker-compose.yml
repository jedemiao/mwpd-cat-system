services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mwpd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mwpd_tracker
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # local-only; not exposed beyond the server. Host port 5433 avoids clashing with a native Postgres install on 5432.
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70
    networks:
      - db-net

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    # Host ports remapped for the same reason Postgres uses 5433 (see the db
    # service and CLAUDE.md): a native MinIO install already owns 9000/9001 on
    # some dev machines, and binding them here fails the whole `up` with
    # "ports are not available". Nothing in the stack depends on these — the app
    # reaches MinIO at minio:9000 and nginx proxies /mwpd-scans/ to the same
    # name, both over storage-net. They exist only for host-side access and the
    # web console.
    ports:
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001" # MinIO web console
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - storage-net

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - minio
      - clamav
    environment:
      DATABASE_URL: postgresql://mwpd:${POSTGRES_PASSWORD}@db:5432/mwpd_tracker
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Public address the browser can reach — Nginx proxies /mwpd-scans/
      # back to this minio service (see nginx.conf). Must NOT be "minio"
      # (that's a Docker-internal name the browser can't resolve); set to
      # the office server's actual LAN address, e.g. http://192.168.1.50
      # or https://mwpd.local once TLS is enabled.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
      # next-auth v4 has no `trustHost` authOptions field (that's a v5/Auth.js
      # API) — this env var is the actual switch. With it set, origin is
      # derived from the incoming request's Host/X-Forwarded-* headers
      # instead of the fixed NEXTAUTH_URL, so login works from any address
      # nginx is reachable on. Safe here because nginx (the only thing that
      # can reach `app`, which is bound to 127.0.0.1) is the sole entry
      # point — no spoofed Host header from outside can reach this directly.
      AUTH_TRUST_HOST: "1"
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      # Docker auto-sets HOSTNAME to the container ID, and the Next.js
      # standalone server binds to `process.env.HOSTNAME || '0.0.0.0'` — so
      # without this override it binds to whatever that container-ID
      # hostname happens to resolve to on ONE of app's three networks,
      # instead of all interfaces. Silently masked before app had multiple
      # networks (there was only one interface to bind to); breaks nginx's
      # proxy_pass once app sits on db-net + storage-net + scan-net.
      HOSTNAME: "0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000" # only Nginx faces the LAN directly
    # Read-only root fs: the standalone server holds no state outside the
    # image itself (uploads go straight to MinIO in memory, never to local
    # disk) — /tmp covers transient scratch space, and .next/cache is where
    # Next's image optimizer writes resized/cached images (found by actually
    # requesting a page with next/image on it — it 500s without this).
    read_only: true
    tmpfs:
      - /tmp
      # uid/gid must match the nextjs user the image runs as (Dockerfile: 1001).
      # A tmpfs mounts root-owned 0755 by default and shadows whatever the image
      # has at that path, so without this the unprivileged process cannot create
      # .next/cache/images and every optimised image raised an unhandled EACCES
      # — which no amount of chown-ing in the Dockerfile could fix, because the
      # mount replaces the directory at container start.
      - /app/.next/cache:uid=1001,gid=1001
    networks:
      - db-net
      - storage-net
      - scan-net

  clamav:
    image: clamav/clamav:1.5.3-debian13-slim
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    ports:
      - "127.0.0.1:3310:3310" # local-only; lets `npm run dev` reach clamd the same way it reaches MinIO
    # First boot downloads the full virus database via freshclam (several
    # minutes) — uploads fail closed with a clear error until clamd is ready
    # (see src/lib/clamav.ts), rather than silently skipping the scan.
    networks:
      - scan-net

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    # nginx needs to write its pid file, client body buffers, and proxy/fastcgi
    # caches — none of that needs to survive a restart, so tmpfs covers it
    # under a read-only root fs.
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    networks:
      - storage-net

  # The nightly encrypted backup, scheduled by the stack itself.
  #
  # This replaced a Windows Task Scheduler job that ran scripts/backup.sh. That
  # job was killed part-way through every run (exit 0xC000013A, with a literal
  # "^C" in its captured output) because the Docker CLI is delivered a spurious
  # console control event in a scheduled session — and it only ran at all while
  # somebody was signed in to Windows, which on an office server is the larger
  # problem of the two.
  #
  # Nothing here shells out to docker: Postgres is reached over db-net, and the
  # documents are a mounted volume. See docker/backup/run-backup.sh.
  backup:
    build: ./docker/backup
    restart: unless-stopped
    depends_on:
      - db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read from the file mounted below rather than from the environment, so
      # the passphrase is not exposed to anyone who can run `docker inspect`.
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup-passphrase
      # 24-hour HH:MM in the container's timezone. Kept at the hour the Windows
      # task used: this machine is not on overnight, so an 02:00 schedule would
      # simply never fire.
      BACKUP_AT: ${BACKUP_AT:-12:00}
      # Unset means keep everything. Set a number of days to start pruning —
      # deliberately opt-in, so nothing deletes an office record by default.
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-}
      TZ: ${TZ:-Asia/Manila}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./backups:/backups
      # Read-only: the backup service must never be able to alter the documents
      # it exists to protect.
      - minio_data:/minio:ro
      - ./secrets/backup-passphrase:/run/secrets/backup-passphrase:ro
    networks:
      - db-net

networks:
  # These are NOT `internal: true`. That was the first attempt at this, but
  # a container whose only network(s) are internal can't have its ports
  # published to the host at all — Docker's bridge driver has no gateway
  # route in or out of an internal network, so db/minio/nginx's published
  # ports (needed for local dev access and for nginx to face the LAN at
  # all) silently never bound. Confirmed by testing a bare nginx container
  # against an internal network before settling on this.
  #
  # So segmentation here is topology-only: db-net is scoped to just app+db
  # (nginx and clamav can't reach the database directly, only through app);
  # storage-net covers app+minio+nginx, since nginx proxies /mwpd-scans/
  # straight to minio (see nginx.conf) without going through app. It does
  # NOT block egress to the LAN/internet the way `internal: true` would —
  # that's a real gap on this platform, not a design choice. The already-published
  # ports being bound to 127.0.0.1 (db, minio, clamav) is what actually keeps
  # them off the LAN; nginx on 80/443 is meant to be LAN-facing.
  db-net:
  storage-net:
  scan-net:

volumes:
  db_data:
  minio_data:
  clamav_data:
