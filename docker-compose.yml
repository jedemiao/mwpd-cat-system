services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mwpd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mwpd_tracker
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # local-only; not exposed beyond the server. Host port 5433 avoids clashing with a native Postgres install on 5432.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001" # MinIO web console

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
      - minio
    environment:
      DATABASE_URL: postgresql://mwpd:${POSTGRES_PASSWORD}@db:5432/mwpd_tracker
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Public address the browser can reach — Nginx proxies /mwpd-scans/
      # back to this minio service (see nginx.conf). Must NOT be "minio"
      # (that's a Docker-internal name the browser can't resolve); set to
      # the office server's actual LAN address, e.g. http://192.168.1.50
      # or https://mwpd.local once TLS is enabled.
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}
    ports:
      - "127.0.0.1:3000:3000" # only Nginx faces the LAN directly

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  db_data:
  minio_data:
