# Minimal reverse proxy for LAN deployment.
# Add the certs/ folder with your cert.pem + key.pem (self-signed is fine
# for a local office server) and uncomment the HTTPS block once ready.

server {
    listen 80;
    server_name _;

    # Live notification stream (SSE): must not be buffered, and needs a long
    # read timeout since the connection is intentionally kept open.
    location /api/notifications/stream {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Scanned-copy downloads: the app hands out MinIO presigned URLs under
    # this bucket path (see src/lib/minio.ts and MINIO_PUBLIC_URL), since
    # the browser can't reach MinIO's internal Docker hostname directly.
    # No trailing path on proxy_pass so the original URI (bucket + key +
    # signature query string) passes through unchanged — the Host header
    # must also stay unmodified, since it's part of what was signed.
    location /mwpd-scans/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

