# Reverse proxy for LAN deployment. certs/cert.pem + certs/key.pem are a
# self-signed pair for the office server's LAN IP/hostname (fine for an
# internal-only deployment) — replace with a CA-issued pair if one becomes
# available. Plain HTTP just redirects to HTTPS; nothing is served over it.

# Brute-force guard on the credentials login callback: 5 attempts/minute per
# IP, sustained (a real user mistyping a password a couple of times in a row
# shouldn't get blocked, so burst absorbs that before the rate limit bites).
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Live notification stream (SSE): must not be buffered, and needs a long
    # read timeout since the connection is intentionally kept open.
    location /api/notifications/stream {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # NextAuth's credentials provider posts here on every login attempt —
    # the actual password check happens on the other end, so this is the
    # one endpoint worth rate-limiting against brute force.
    location /api/auth/callback/credentials {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Scanned-copy downloads: the app hands out MinIO presigned URLs under
    # this bucket path (see src/lib/minio.ts and MINIO_PUBLIC_URL), since
    # the browser can't reach MinIO's internal Docker hostname directly.
    # No trailing path on proxy_pass so the original URI (bucket + key +
    # signature query string) passes through unchanged — the Host header
    # must also stay unmodified, since it's part of what was signed.
    location /mwpd-scans/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
